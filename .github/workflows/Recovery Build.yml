name: PBRP Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
          - android-12.1
          - android-11
          - android-10
          - android-9.0
          - android-8.1
          - android-7.1
        required: true
        default: android-12.1
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
      DEVICE_PATH:
        description: Path to sync device tree (e.g., device/oem/device)
        required: true
      DEVICE_NAME:
        description: Device codename (e.g., a10)
        required: true
      BUILD_TARGET:
        type: choice
        description: Partition to build
        options:
          - boot
          - recovery
          - vendor_boot
        required: true
        default: recovery

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Show inputs
        run: |
          echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
          echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ inputs.DEVICE_PATH }}"
          echo "Device Codename: ${{ inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ inputs.BUILD_TARGET }}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt -y install openjdk-8-jdk git curl gnupg flex bison gperf zip unzip python3

      - name: Download repo tool
        run: |
          mkdir -p $HOME/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo  > $HOME/bin/repo
          chmod a+x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup repo and sync manifest
        run: |
          mkdir -p workspace
          cd workspace
          # Use absolute path to repo (bypass PATH issues)
          $HOME/bin/repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git  -b ${{ inputs.MANIFEST_BRANCH }}
          $HOME/bin/repo sync -j$(nproc) --force-sync --no-tags --no-clone-bundle

      - name: Clone device tree
        run: |
          cd workspace
          git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}

      - name: Setup build environment
        run: |
          cd workspace
          source build/envsetup.sh
          lunch pb_${{ inputs.DEVICE_NAME }}-eng

      - name: Build recovery
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          make ${{ inputs.BUILD_TARGET }}image -j$(nproc)

      - name: Upload build
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.img
