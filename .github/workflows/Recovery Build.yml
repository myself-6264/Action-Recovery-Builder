name: PBRP Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        type: choice
        description: Manifest Branch
        options:
          - android-12.1
          - android-11
          - android-10
          - android-9.0
          - android-8.1
          - android-7.1
        required: true
        default: android-12.1
      DEVICE_TREE_URL:
        description: Device Tree URL
        required: true
      DEVICE_TREE_BRANCH:
        description: Device Tree Branch
        required: true
      DEVICE_PATH:
        description: Path to sync device tree (e.g., device/oem/device)
        required: true
      DEVICE_NAME:
        description: Device codename (e.g., a10)
        required: true
      BUILD_TARGET:
        type: choice
        description: Partition to build
        options:
          - boot
          - recovery
          - vendor_boot
        required: true
        default: recovery

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04  # Use Ubuntu 20.04 container for legacy 32-bit support

    steps:
      - name: Show inputs
        run: |
          echo "Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ inputs.DEVICE_TREE_URL }}"
          echo "Device Branch: ${{ inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ inputs.DEVICE_PATH }}"
          echo "Device Codename: ${{ inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ inputs.BUILD_TARGET }}"

      - name: Install base dependencies
        run: |
          apt update
          apt install -y software-properties-common

      - name: Add Multiarch & Update Packages
        run: |
          dpkg --add-architecture armhf
          dpkg --add-architecture arm64
          apt update

      - name: Install dependencies (Ubuntu 20.04 compatible)
        run: |
          apt install -y openjdk-8-jdk git curl gnupg flex bison gperf \
                         zip unzip zlib1g-dev \
                         libncurses-dev:armhf libtinfo-dev:armhf \
                         libreadline-dev:armhf \
                         libssl-dev:armhf libxml2-utils \
                         x11proto-core-dev libx11-dev \
                         g++-multilib-armhf lib32z1-dev \
                         python3

      - name: Set Java 8 as default
        run: |
          update-alternatives --set java /usr/lib/jvm/java-8-openjdk-amd64/jre/bin/java
          update-alternatives --set javac /usr/lib/jvm/java-8-openjdk-amd64/bin/javac

      - name: Download repo tool
        run: |
          mkdir -p $HOME/bin
          curl -o $HOME/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x $HOME/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup and sync PBRP manifest
        run: |
          set -e
          mkdir -p workspace
          cd workspace
          repo init -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b ${{ inputs.MANIFEST_BRANCH }}
          repo sync -j$(nproc) --force-sync --no-tags --no-clone-bundle
        shell: bash

      - name: Clone device tree
        run: |
          cd workspace
          git clone ${{ inputs.DEVICE_TREE_URL }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ${{ inputs.DEVICE_PATH }}
        shell: bash

      - name: Build recovery image
        run: |
          set -e
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch pb_${{ inputs.DEVICE_NAME }}-eng
          make ${{ inputs.BUILD_TARGET }}image -j$(nproc)
        shell: bash

      - name: Upload recovery image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pb-${{ inputs.DEVICE_NAME }}-${{ inputs.BUILD_TARGET }}.img
          path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/*.img

      - name: Create GitHub Release
        if: success()
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'build-${{ inputs.DEVICE_NAME }}-${{ github.run_number }}';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: 'PBRP Build ${{ github.run_number }} for ${{ inputs.DEVICE_NAME }}',
              body: `
                - Device: ${{ inputs.DEVICE_NAME }}
                - Build Target: ${{ inputs.BUILD_TARGET }}
                - Manifest Branch: ${{ inputs.MANIFEST_BRANCH }}
                - CI Run: ${{ github.run_number }}
              `,
              draft: false,
              prerelease: false
            });
            return { tag: tag };
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        if: success()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: workspace/out/target/product/${{ inputs.DEVICE_NAME }}/${{ inputs.BUILD_TARGET }}.img
          asset_name: pb-${{ inputs.DEVICE_NAME }}-${{ inputs.BUILD_TARGET }}.img
          content_type: application/octet-stream
